[project]
name = "invoice-intake-agent"
version = "0.1.0"
description = "Invoice intake agent built on the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.17.2",
    "openai>=1.51.0",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "rapidocr-onnxruntime>=1.4.0",
]

[project.scripts]
invoice-intake = "invoice_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=invoice_agent --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["invoice_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
